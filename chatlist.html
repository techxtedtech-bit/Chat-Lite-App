<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Chats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">

        <!-- HEADER -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90 backdrop-blur-md">
            <div onclick="window.location.href='profile.html'"
                 class="flex items-center gap-3 cursor-pointer group">

                <div id="header-avatar"
                     class="w-10 h-10 rounded-full bg-orange-600/20 border border-orange-500/30 flex items-center justify-center font-bold text-orange-400 text-sm overflow-hidden shadow-inner">
                </div>

                <div>
                    <h2 class="font-bold text-base text-white group-hover:text-orange-400 transition-colors flex items-center gap-1.5">
                        <span id="current-user-name">Loading...</span>

                        <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-orange-400 transition-colors"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                            </path>
                        </svg>
                    </h2>

                    <span class="text-xs text-emerald-400 flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                        Online
                    </span>
                </div>
            </div>

            <button onclick="handleLogout()"
                    class="text-xs text-slate-400 hover:text-red-400 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60 transition-all cursor-pointer backdrop-blur-md">
                Sign Out
            </button>
        </div>

        <!-- ACTION BAR -->
        <div class="px-4 py-3 bg-slate-950 border-b border-slate-800/80 flex items-center gap-2">

            <button onclick="openInviteModal()"
                    class="flex-1 py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-orange-600/20 transition-all cursor-pointer text-center">
                + Add Contact
            </button>

            <button onclick="window.location.href='creategroup.html'"
                    class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold rounded-xl text-xs transition-all cursor-pointer text-center">
                + Create Group
            </button>

        </div>

        <!-- SECTION TITLE -->
        <div class="px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
            <span>Conversations & Requests</span>
        </div>

        <!-- CHAT LIST -->
        <div id="members-list"
             class="flex-1 overflow-y-auto divide-y divide-slate-800/40 bg-slate-900/40">

            <div class="p-8 text-center text-slate-500 text-sm">
                Loading chats & connections...
            </div>

        </div>
    </div>

    <!-- ADD CONTACT MODAL -->
    <div id="invite-modal"
         class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">

            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white">
                    Add Contact via Chat Code
                </h3>

                <button onclick="closeInviteModal()"
                        class="text-slate-400 hover:text-white text-xl cursor-pointer">
                    &times;
                </button>
            </div>

            <p class="text-xs text-slate-400">
                Enter your contact's unique Chat Code to send them a connection invite.
            </p>

            <form onsubmit="sendInvitation(event)" class="space-y-3">

                <input type="text"
                       id="target-chat-code"
                       placeholder="e.g. CL-ABC1234"
                       required
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm font-mono text-white uppercase">

                <button type="submit"
                        class="w-full py-3 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl text-sm text-white transition-all cursor-pointer shadow-lg shadow-orange-600/20">
                    Send Invitation
                </button>

            </form>
        </div>
    </div>

    <script src="supabase.js"></script>

    <script>

        let currentUser = JSON.parse(localStorage.getItem('chatlite_user'));
        let isInitialLoad = true;

        /* ==========================================
           AUTH / INITIAL LOAD
        ========================================== */

        if (!currentUser) {

            window.location.href = 'index.html';

        } else {

            initHeaderProfile();
            loadConnectionsAndChats();
            setupRealtimeSubscriptions();

            // Handle forwarded payload if redirected from chatroom
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('forward') === 'true') {
                const forwardPayload = localStorage.getItem('chatlite_forward_payload');
                if (forwardPayload) {
                    const titleBar = document.querySelector('div.bg-slate-900\\/80 span');
                    if (titleBar) titleBar.textContent = 'Select chat to forward message';
                }
            }

            // Fallback periodic refresh
            setInterval(() => loadConnectionsAndChats(true), 10000);
        }


        /* ==========================================
           REALTIME SUBSCRIPTIONS
        ========================================== */

        function setupRealtimeSubscriptions() {
            if (!currentUser || !currentUser.username) return;

            // Listen to new private messages
            supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const msg = payload.new;
                    if (msg.sender_username === currentUser.username || msg.receiver_username === currentUser.username) {
                        loadConnectionsAndChats(true);
                    }
                })
                .subscribe();

            // Listen to new group messages
            supabaseClient
                .channel('public:group_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages' }, () => {
                    loadConnectionsAndChats(true);
                })
                .subscribe();
        }


        /* ==========================================
           HEADER PROFILE
        ========================================== */

        function initHeaderProfile() {

            const nameElement = document.getElementById('current-user-name');
            const avatarContainer = document.getElementById('header-avatar');

            nameElement.textContent = currentUser.name || currentUser.username || 'User';

            avatarContainer.innerHTML = '';

            if (currentUser.avatar_url) {

                const img = document.createElement('img');

                img.src = currentUser.avatar_url;
                img.alt = currentUser.name || 'Profile';
                img.className = 'w-full h-full object-cover';

                avatarContainer.appendChild(img);

            } else {

                avatarContainer.textContent =
                    (currentUser.name || currentUser.username || 'U')
                    .charAt(0)
                    .toUpperCase();
            }
        }


        /* ==========================================
           INVITE MODAL
        ========================================== */

        function openInviteModal() {

            const modal = document.getElementById('invite-modal');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }


        function closeInviteModal() {

            const modal = document.getElementById('invite-modal');

            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }


        /* ==========================================
           SEND CONTACT INVITATION
        ========================================== */

        async function sendInvitation(e) {

            e.preventDefault();

            const input = document.getElementById('target-chat-code');

            const targetCode = input.value.trim().toUpperCase();

            if (!targetCode) return;

            if (targetCode === currentUser.chat_code) {

                alert("You cannot add your own chat code.");
                return;
            }


            // Find target user
            const { data: targetUser, error: findError } =
                await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('chat_code', targetCode)
                    .maybeSingle();


            if (findError || !targetUser) {

                alert('Invalid Chat Code. No user found with this code.');
                return;
            }


            // Check existing connection
            const { data: existingConn } =
                await supabaseClient
                    .from('connections')
                    .select('*')
                    .or(
                        `and(sender_username.eq.${currentUser.username},receiver_username.eq.${targetUser.username}),and(sender_username.eq.${targetUser.username},receiver_username.eq.${currentUser.username})`
                    )
                    .maybeSingle();


            if (existingConn) {

                if (existingConn.status === 'accepted') {

                    alert('You are already connected with this user!');

                } else if (existingConn.status === 'pending') {

                    alert('An invitation is already pending between you two.');

                } else if (existingConn.status === 'blocked') {

                    alert('Unable to connect with this user.');
                }

                return;
            }


            // Create connection
            const { error: insertError } =
                await supabaseClient
                    .from('connections')
                    .insert([{
                        sender_username: currentUser.username,
                        receiver_username: targetUser.username,
                        status: 'pending'
                    }]);


            if (insertError) {

                alert('Error sending invite: ' + insertError.message);
                return;
            }


            alert(`Invitation sent successfully to ${targetUser.name}!`);

            input.value = '';

            closeInviteModal();

            loadConnectionsAndChats();
        }


        /* ==========================================
           LOAD GROUPS + PRIVATE CONNECTIONS
        ========================================== */

        async function loadConnectionsAndChats(isBackgroundRefresh = false) {

            if (!navigator.onLine) return;

            if (!currentUser || !currentUser.username) return;


            /* ------------------------------------------
               Refresh current profile
            ------------------------------------------ */

            const { data: freshProfile } =
                await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('username', currentUser.username)
                    .maybeSingle();


            if (freshProfile) {

                currentUser = freshProfile;

                localStorage.setItem(
                    'chatlite_user',
                    JSON.stringify(currentUser)
                );

                initHeaderProfile();
            }


            const listContainer =
                document.getElementById('members-list');

            // Only show loading indicator on very first load
            if (isInitialLoad) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-500 text-sm">
                        Loading chats & connections...
                    </div>
                `;
            }

            // Array to collect all items with their latest activity timestamp for sorting
            let chatItems = [];


            /* ==========================================
               1. GROUP CHATS
            ========================================== */

            const {
                data: groupMemberships,
                error: groupErr
            } = await supabaseClient
                .from('group_members')
                .select('*, groups(*)')
                .eq('username', currentUser.username);


            if (
                !groupErr &&
                groupMemberships &&
                groupMemberships.length > 0
            ) {

                for (const membership of groupMemberships) {

                    const group = membership.groups;

                    if (!group) continue;


                    const item = document.createElement('div');

                    item.className =
                        'flex items-center justify-between p-3.5 border-b border-slate-800/40 bg-slate-900/60';


                    /* GROUP AVATAR */

                    let avatarHTML = '';

                    if (group.avatar_url) {

                        avatarHTML = `
                            <img
                                src="${escapeAttribute(group.avatar_url)}"
                                class="w-12 h-12 rounded-full object-cover"
                                alt="Group"
                            >
                        `;

                    } else {

                        avatarHTML = `
                            <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-orange-400 text-base">
                                GRP
                            </div>
                        `;
                    }


                    /* ACCEPTED GROUP */

                    if (membership.status === 'accepted') {

                        item.className +=
                            ' hover:bg-slate-800/50 cursor-pointer transition-all';


                        // Fetch the latest message for this group
                        const { data: groupLastMsgData } = await supabaseClient
                            .from('group_messages')
                            .select('*')
                            .eq('group_id', group.id)
                            .order('created_at', { ascending: false })
                            .limit(1);

                        let groupLastMsgText = group.description ? group.description : 'Tap to open chat';
                        let groupTickHTML = '';
                        let groupTimeStr = '';
                        let groupActivityTime = group.created_at ? new Date(group.created_at).getTime() : 0;

                        if (groupLastMsgData && groupLastMsgData.length > 0) {
                            const gMsg = groupLastMsgData[0];
                            if (gMsg.created_at) {
                                groupActivityTime = new Date(gMsg.created_at).getTime();
                            }
                            if (!gMsg.is_deleted_for_everyone) {
                                if (gMsg.media_type === 'image') {
                                    groupLastMsgText = '📷 Photo';
                                } else if (gMsg.media_type === 'video') {
                                    groupLastMsgText = '🎬 Video';
                                } else if (gMsg.media_type === 'audio') {
                                    groupLastMsgText = '🎤 Voice note';
                                } else if (gMsg.media_type === 'file') {
                                    groupLastMsgText = '📁 File';
                                } else {
                                    groupLastMsgText = gMsg.message || '';
                                }

                                if (gMsg.created_at) {
                                    const msgDate = new Date(gMsg.created_at);
                                    const today = new Date();
                                    if (msgDate.toDateString() === today.toDateString()) {
                                        groupTimeStr = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                    } else {
                                        groupTimeStr = msgDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
                                    }
                                }

                                if (gMsg.sender_username === currentUser.username) {
                                    groupTickHTML = `<span class="text-orange-400 text-xs font-bold" title="Sent">✓✓</span>`;
                                }
                            }
                        }


                        const groupOpenArea = document.createElement('div');

                        groupOpenArea.className =
                            'flex items-center gap-3.5 flex-1 min-w-0';


                        groupOpenArea.onclick = function () {

                            window.location.href =
                                `groupchat.html?id=${encodeURIComponent(group.id)}`;
                        };


                        groupOpenArea.innerHTML = `

                            <div class="relative">
                                ${avatarHTML}

                                <span class="absolute bottom-0 right-0 w-3 h-3 bg-orange-500 border-2 border-slate-900 rounded-full"></span>
                            </div>

                            <div class="flex-1 min-w-0">

                                <div class="flex items-center justify-between gap-1">
                                    <h4 class="font-semibold text-sm truncate text-white">
                                        ${escapeHTML(group.name)}
                                    </h4>
                                    <span class="text-[10px] text-slate-400 flex-shrink-0">${groupTimeStr}</span>
                                </div>

                                <p class="text-xs text-slate-400 truncate flex items-center gap-1.5 mt-0.5">
                                    ${groupTickHTML}
                                    <span class="truncate">${escapeHTML(groupLastMsgText)}</span>
                                </p>

                            </div>
                        `;


                        item.appendChild(groupOpenArea);
                        chatItems.push({ element: item, lastActivity: groupActivityTime });
                    }


                    /* PENDING GROUP INVITE */

                    else if (membership.status === 'pending') {

                        const inviteActivityTime = membership.created_at ? new Date(membership.created_at).getTime() : Date.now();

                        item.innerHTML = `

                            <div class="flex items-center gap-3.5 flex-1 min-w-0">

                                ${avatarHTML}

                                <div class="flex-1 min-w-0">

                                    <h4 class="font-semibold text-sm truncate text-white">
                                        ${escapeHTML(group.name)}
                                    </h4>

                                    <p class="text-xs text-orange-400 truncate">
                                        Group Invite from @${escapeHTML(group.created_by)}
                                    </p>

                                </div>

                            </div>

                            <div class="flex items-center gap-2">

                                <button
                                    onclick="updateGroupMembership('${escapeAttribute(membership.id)}', 'accepted')"
                                    class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-white font-semibold transition-all cursor-pointer">
                                    Accept
                                </button>

                                <button
                                    onclick="updateGroupMembership('${escapeAttribute(membership.id)}', 'declined')"
                                    class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition-all cursor-pointer">
                                    Decline
                                </button>

                            </div>
                        `;

                        chatItems.push({ element: item, lastActivity: inviteActivityTime });
                    }
                }
            }


            /* ==========================================
               2. PRIVATE CONNECTIONS
            ========================================== */

            const {
                data: connections,
                error
            } = await supabaseClient
                .from('connections')
                .select('*')
                .or(
                    `sender_username.eq.${currentUser.username},receiver_username.eq.${currentUser.username}`
                );


            if (
                !error &&
                connections &&
                connections.length > 0
            ) {

                let relatedUsernames = [];


                connections.forEach(connection => {

                    if (
                        connection.sender_username ===
                        currentUser.username
                    ) {

                        relatedUsernames.push(
                            connection.receiver_username
                        );
                    }


                    if (
                        connection.receiver_username ===
                        currentUser.username
                    ) {

                        relatedUsernames.push(
                            connection.sender_username
                        );
                    }
                });


                // Remove duplicates
                relatedUsernames =
                    [...new Set(relatedUsernames)];


                let profileMap = {};


                if (relatedUsernames.length > 0) {

                    const { data: profiles } =
                        await supabaseClient
                            .from('profiles')
                            .select('*')
                            .in('username', relatedUsernames);


                    if (profiles) {

                        profiles.forEach(profile => {

                            profileMap[profile.username] =
                                profile;
                        });
                    }
                }


                for (const conn of connections) {

                    const otherUsername =
                        conn.sender_username === currentUser.username
                            ? conn.receiver_username
                            : conn.sender_username;


                    const member =
                        profileMap[otherUsername];


                    if (!member) continue;


                    const item =
                        document.createElement('div');


                    item.className =
                        'flex items-center justify-between p-3.5 border-b border-slate-800/40 bg-slate-900/60';


                    /* USER AVATAR */

                    let avatarHTML = '';

                    if (member.avatar_url) {

                        avatarHTML = `
                            <img
                                src="${escapeAttribute(member.avatar_url)}"
                                class="w-12 h-12 rounded-full object-cover"
                                alt="${escapeAttribute(member.name || member.username)}"
                            >
                        `;

                    } else {

                        avatarHTML = `
                            <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-orange-400 text-base">
                                ${escapeHTML(
                                    (member.name || member.username || 'U')
                                        .charAt(0)
                                        .toUpperCase()
                                )}
                            </div>
                        `;
                    }


                    /* ------------------------------------------
                       ACCEPTED CONNECTION
                    ------------------------------------------ */

                    if (conn.status === 'accepted') {

                        item.className +=
                            ' hover:bg-slate-800/50 cursor-pointer transition-all';


                        // Fetch the latest message between current user and this member
                        const { data: lastMsgData } = await supabaseClient
                            .from('messages')
                            .select('*')
                            .or(`and(sender_username.eq.${currentUser.username},receiver_username.eq.${member.username}),and(sender_username.eq.${member.username},receiver_username.eq.${currentUser.username})`)
                            .order('created_at', { ascending: false })
                            .limit(1);

                        let lastMsgText = 'No messages yet';
                        let tickHTML = '';
                        let timeStr = '';
                        let isUnread = false;
                        let chatActivityTime = conn.created_at ? new Date(conn.created_at).getTime() : 0;

                        if (lastMsgData && lastMsgData.length > 0) {
                            const msg = lastMsgData[0];
                            if (msg.created_at) {
                                chatActivityTime = new Date(msg.created_at).getTime();
                            }
                            
                            if (msg.message_type === 'image') {
                                lastMsgText = '📷 Photo';
                            } else if (msg.message_type === 'audio') {
                                lastMsgText = '🎤 Voice note';
                            } else {
                                lastMsgText = msg.content || '';
                            }

                            if (msg.created_at) {
                                const msgDate = new Date(msg.created_at);
                                const today = new Date();
                                if (msgDate.toDateString() === today.toDateString()) {
                                    timeStr = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                } else {
                                    timeStr = msgDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
                                }
                            }

                            // Check unread status (if message was sent TO current user and is NOT read)
                            if (msg.receiver_username === currentUser.username && !msg.is_read) {
                                isUnread = true;
                            }

                            // Ticks logic for messages sent by current user
                            if (msg.sender_username === currentUser.username) {
                                if (msg.is_read) {
                                    tickHTML = `<span class="text-sky-400 font-bold text-xs" title="Read">✓✓</span>`;
                                } else {
                                    tickHTML = `<span class="text-slate-400 text-xs" title="Sent">✓✓</span>`;
                                }
                            } else {
                                if (!msg.is_read) {
                                    tickHTML = `<span class="w-2 h-2 rounded-full bg-orange-500 inline-block"></span>`;
                                }
                            }
                        }


                        /* Clickable chat area */

                        const chatArea =
                            document.createElement('div');


                        chatArea.className =
                            'flex items-center gap-3.5 flex-1 min-w-0';


                        chatArea.onclick = function () {
                            const urlParams = new URLSearchParams(window.location.search);
                            if (urlParams.get('forward') === 'true') {
                                const forwardPayload = JSON.parse(localStorage.getItem('chatlite_forward_payload') || '{}');
                                localStorage.removeItem('chatlite_forward_payload');
                                
                                supabaseClient.from('messages').insert([{
                                    sender_username: currentUser.username,
                                    receiver_username: member.username,
                                    content: forwardPayload.content,
                                    message_type: forwardPayload.type || 'text',
                                    is_read: false,
                                    created_at: new Date().toISOString()
                                }]).then(() => {
                                    window.location.href = `chatroom.html?to=${encodeURIComponent(member.username)}&name=${encodeURIComponent(member.name || member.username)}&gender=${encodeURIComponent(member.gender || '')}`;
                                });
                            } else {
                                openChatRoom(
                                    member.username,
                                    member.name,
                                    member.gender || ''
                                );
                            }
                        };


                        chatArea.innerHTML = `

                            <div class="relative">

                                ${avatarHTML}

                                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>

                            </div>

                            <div class="flex-1 min-w-0">

                                <div class="flex items-center justify-between gap-1">
                                    <h4 class="font-semibold text-sm truncate ${isUnread ? 'text-white font-bold' : 'text-slate-200'}">
                                        ${escapeHTML(member.name || member.username)}
                                    </h4>
                                    <span class="text-[10px] text-slate-400 flex-shrink-0">${timeStr}</span>
                                </div>

                                <p class="text-xs truncate flex items-center gap-1.5 mt-0.5 ${isUnread ? 'text-white font-bold' : 'text-slate-400'}">
                                    ${tickHTML}
                                    <span class="truncate">${escapeHTML(lastMsgText)}</span>
                                </p>

                            </div>
                        `;


                        item.appendChild(chatArea);
                        chatItems.push({ element: item, lastActivity: chatActivityTime });
                    }


                    /* ------------------------------------------
                       PENDING CONNECTION
                    ------------------------------------------ */

                    else if (conn.status === 'pending') {

                        const connActivityTime = conn.created_at ? new Date(conn.created_at).getTime() : Date.now();

                        /* Incoming request */

                        if (
                            conn.receiver_username ===
                            currentUser.username
                        ) {

                            item.innerHTML = `

                                <div class="flex items-center gap-3.5 flex-1 min-w-0">

                                    ${avatarHTML}

                                    <div class="flex-1 min-w-0">

                                        <h4 class="font-semibold text-sm truncate text-white">
                                            ${escapeHTML(member.name || member.username)}
                                        </h4>

                                        <p class="text-xs text-orange-400 truncate">
                                            Wants to connect with you
                                        </p>

                                    </div>

                                </div>

                                <div class="flex items-center gap-2">

                                    <button
                                        onclick="updateConnectionStatus('${escapeAttribute(conn.id)}', 'accepted')"
                                        class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-white font-semibold transition-all cursor-pointer">
                                        Accept
                                    </button>

                                    <button
                                        onclick="updateConnectionStatus('${escapeAttribute(conn.id)}', 'declined')"
                                        class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition-all cursor-pointer">
                                        Decline
                                    </button>

                                </div>
                            `;
                        }


                        /* Outgoing request */

                        else {

                            item.innerHTML = `

                                <div class="flex items-center gap-3.5 flex-1 min-w-0">

                                    ${avatarHTML}

                                    <div class="flex-1 min-w-0">

                                        <h4 class="font-semibold text-sm truncate text-white">
                                            ${escapeHTML(member.name || member.username)}
                                        </h4>

                                        <p class="text-xs text-slate-400 truncate">
                                            Invitation Pending...
                                        </p>

                                    </div>

                                </div>

                                <button
                                    onclick="updateConnectionStatus('${escapeAttribute(conn.id)}', 'declined')"
                                    class="text-[10px] text-slate-400 hover:text-red-400 bg-slate-800 px-2.5 py-1.5 rounded-lg transition-all cursor-pointer">
                                    Cancel
                                </button>
                            `;
                        }

                        chatItems.push({ element: item, lastActivity: connActivityTime });
                    }


                    /* ------------------------------------------
                       BLOCKED CONNECTION
                    ------------------------------------------ */

                    else if (conn.status === 'blocked') {

                        const blockActivityTime = conn.created_at ? new Date(conn.created_at).getTime() : 0;
                        item.className += ' opacity-60';


                        item.innerHTML = `

                            <div class="flex items-center gap-3.5 flex-1 min-w-0">

                                ${avatarHTML}

                                <div class="flex-1 min-w-0">

                                    <h4 class="font-semibold text-sm truncate text-white">
                                        ${escapeHTML(member.name || member.username)}
                                    </h4>

                                    <p class="text-xs text-red-400 truncate">
                                        Blocked Connection
                                    </p>

                                </div>

                            </div>

                            <button
                                onclick="updateConnectionStatus('${escapeAttribute(conn.id)}', 'accepted')"
                                class="text-[10px] text-emerald-400 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg transition-all cursor-pointer">
                                Unblock
                            </button>
                        `;

                        chatItems.push({ element: item, lastActivity: blockActivityTime });
                    }
                }
            }


            /* ==========================================
               SORT BY RECENT ACTIVITY & RENDER
            ========================================== */

            chatItems.sort((a, b) => b.lastActivity - a.lastActivity);

            const fragment = document.createDocumentFragment();
            chatItems.forEach(itemObj => {
                fragment.appendChild(itemObj.element);
            });


            /* ==========================================
               EMPTY STATE
            ========================================== */

            if (chatItems.length === 0) {

                listContainer.innerHTML = `

                    <div class="p-8 text-center text-slate-500 text-sm">

                        No chats or group invites yet.

                        Tap
                        <b>+ Add Contact</b>
                        or
                        <b>+ Create Group</b>
                        above to begin.

                    </div>
                `;
            } else {
                listContainer.innerHTML = '';
                listContainer.appendChild(fragment);
            }

            isInitialLoad = false;
        }


        /* ==========================================
           CONNECTION STATUS
        ========================================== */

        async function updateConnectionStatus(connId, newStatus) {

            if (newStatus === 'declined') {

                await supabaseClient
                    .from('connections')
                    .delete()
                    .eq('id', connId);

            } else {

                await supabaseClient
                    .from('connections')
                    .update({
                        status: newStatus
                    })
                    .eq('id', connId);
            }

            loadConnectionsAndChats();
        }


        /* ==========================================
           GROUP MEMBERSHIP
        ========================================== */

        async function updateGroupMembership(
            membershipId,
            newStatus
        ) {

            if (newStatus === 'declined') {

                await supabaseClient
                    .from('group_members')
                    .delete()
                    .eq('id', membershipId);

            } else {

                await supabaseClient
                    .from('group_members')
                    .update({
                        status: newStatus
                    })
                    .eq('id', membershipId);
            }

            loadConnectionsAndChats();
        }


        /* ==========================================
           OPEN PRIVATE CHAT
           ========================================== */

        function openChatRoom(username, name, gender) {

            const safeUsername =
                encodeURIComponent(username || '');

            const safeName =
                encodeURIComponent(name || username || 'Chat');

            const safeGender =
                encodeURIComponent(gender || '');


            window.location.href =
                `chatroom.html?to=${safeUsername}&name=${safeName}&gender=${safeGender}`;
        }


        /* ==========================================
           LOGOUT
        ========================================== */

        function handleLogout() {

            localStorage.removeItem('chatlite_user');

            window.location.href = 'index.html';
        }


        /* ==========================================
           SECURITY / DISPLAY HELPERS
        ========================================== */

        function escapeHTML(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        function escapeAttribute(value) {

            return escapeHTML(value);
        }

    </script>

    <!-- SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered successfully!'))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
