<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lite - Create Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col w-full max-w-md mx-auto relative overflow-hidden shadow-2xl bg-slate-900 border-x border-slate-800 h-screen">
        
        <!-- Background Image Container -->
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('image1-bg.jpg');">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/85 to-slate-950/60"></div>
        </div>

        <!-- Content Area -->
        <div class="relative z-10 flex flex-col justify-center flex-1 p-6 h-full overflow-y-auto">
            <div class="space-y-6 my-auto">
                <div class="flex items-center justify-between">
                    <button onclick="window.location.href='index.html'" class="text-slate-300 hover:text-white text-sm flex items-center gap-1 cursor-pointer bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-700/50 backdrop-blur-md transition-all">&larr; Back</button>
                    <h2 class="text-xl font-bold text-white tracking-wide">Create Profile</h2>
                    <div class="w-12"></div>
                </div>

                <form id="register-form" onsubmit="handleRegister(event)" autocomplete="off" class="space-y-4 pb-4">
                    <input type="text" style="display:none" name="prevent_autofill">
                    <input type="password" style="display:none" name="prevent_autofill">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                        <input type="text" id="reg-name" name="new_fullname_random" autocomplete="off" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-orange-500 focus:bg-white/10 text-sm text-white backdrop-blur-md transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Gender</label>
                        <select id="reg-gender" name="new_gender_random" class="w-full px-4 py-3 bg-slate-950/60 border border-white/10 rounded-xl focus:outline-none focus:border-orange-500 text-sm text-white backdrop-blur-md transition-all">
                            <option value="Male" class="bg-slate-900">Male</option>
                            <option value="Female" class="bg-slate-900">Female</option>
                            <option value="Other" class="bg-slate-900">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                        <input type="text" id="reg-username" name="new_username_random" autocomplete="off" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-orange-500 focus:bg-white/10 text-sm text-white backdrop-blur-md transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                        <input type="password" id="reg-password" name="new_password_random" autocomplete="new-password" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-orange-500 focus:bg-white/10 text-sm text-white backdrop-blur-md transition-all shadow-inner">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-semibold rounded-xl shadow-lg shadow-orange-600/30 transition-all mt-4 cursor-pointer text-white flex items-center justify-center">
                        Register Profile
                    </button>
                </form>
            </div>
        </div>

        <!-- Custom Styled Alert/Notification Modal -->
        <div id="custom-alert-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-5 space-y-4 shadow-2xl text-center">
                <div class="w-10 h-10 bg-orange-600/20 text-orange-500 rounded-full flex items-center justify-center mx-auto text-lg font-bold" id="custom-alert-icon">
                    !
                </div>
                <div class="space-y-1">
                    <h4 class="font-bold text-sm text-white" id="custom-alert-title">Notice</h4>
                    <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line" id="custom-alert-message">Something went wrong.</p>
                </div>
                <button type="button" onclick="closeCustomAlert()" class="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs rounded-xl transition-all cursor-pointer shadow-lg shadow-orange-600/20">
                    Okay
                </button>
            </div>
        </div>

    </div>

    <script src="supabase.js"></script>
    <script>
        function showCustomAlert(message, title = "Notice") {
            document.getElementById('custom-alert-title').textContent = title;
            document.getElementById('custom-alert-message').textContent = message;
            const alertModal = document.getElementById('custom-alert-modal');
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }

        function closeCustomAlert() {
            const alertModal = document.getElementById('custom-alert-modal');
            alertModal.classList.remove('flex');
            alertModal.classList.add('hidden');
            
            // If it was a successful registration, redirect after closing modal
            if (window.isRegistrationSuccess) {
                window.location.href = 'index.html';
            }
        }

        function generateChatCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'CL-';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const name = document.getElementById('reg-name').value.trim();
            const gender = document.getElementById('reg-gender').value;
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;

            if (!name || !username || !password) {
                showCustomAlert('Please fill in all required fields.', 'Missing Information');
                return;
            }

            // Lock button & show loading state to prevent double-submits or freezing confusion
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Profile...';

            try {
                // 1. Check if username already exists
                const { data: existing, error: checkError } = await supabaseClient
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();

                if (checkError) {
                    throw new Error('Database check failed: ' + checkError.message);
                }

                if (existing) {
                    showCustomAlert('Username is already taken. Please choose another.', 'Username Taken');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register Profile';
                    return;
                }

                // 2. Generate a unique chat code for the user
                let chatCode = generateChatCode();
                let isUnique = false;
                let attempts = 0;

                while (!isUnique && attempts < 5) {
                    const { data: codeCheck } = await supabaseClient
                        .from('profiles')
                        .select('chat_code')
                        .eq('chat_code', chatCode)
                        .maybeSingle();
                    
                    if (!codeCheck) {
                        isUnique = true;
                    } else {
                        chatCode = generateChatCode();
                        attempts++;
                    }
                }

                // 3. Insert new profile into Supabase
                const { error: insertError } = await supabaseClient
                    .from('profiles')
                    .insert([{ name, gender, username, password, chat_code: chatCode }]);

                if (insertError) {
                    throw new Error(insertError.message);
                }

                window.isRegistrationSuccess = true;
                showCustomAlert(`Profile created successfully!\n\nYour Unique Chat Code is: ${chatCode}\nSave this or use it to sign in.`, 'Success');

            } catch (err) {
                console.error('Registration exception:', err);
                showCustomAlert('Error creating profile: ' + (err.message || 'Network connection or database issue occurred.'), 'Registration Error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Profile';
            }
        }
    </script>
</body>
</html>
